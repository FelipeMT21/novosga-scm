version: '3'

services:
  # Aplicação Novo SGA
  app:
    build: .
    container_name: novosga_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db
    links:
      - db

  # Banco de Dados (PostgreSQL 9.6 - Versão compatível com a época)
  db:
    image: postgres:9.6-alpine
    container_name: novosga_db
    environment:
      POSTGRES_DB: novosga
      POSTGRES_USER: novosga
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: